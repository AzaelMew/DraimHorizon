<text x="52" y="96" class="t">Passages and dry ground.</text>
<circle cx="60" cy="134" r="3.5" fill="#a99bff"/><text x="76" y="140" class="s">Tunnel: length, width 1–3, height 2–3, floor fill.</text>
<circle cx="60" cy="172" r="3.5" fill="#a99bff"/><text x="76" y="178" class="s">Bridge: a level one-wide path over any gap.</text>
<circle cx="60" cy="210" r="3.5" fill="#a99bff"/><text x="76" y="216" class="s">Drain: sand and gravel; fill, lines or a grid.</text>
<circle cx="60" cy="248" r="3.5" fill="#a99bff"/><text x="76" y="254" class="s">Swims out of the water by itself.</text>
