<text x="52" y="96" class="t">Preview, place, then build.</text>
<circle cx="60" cy="134" r="3.5" fill="#a99bff"/><text x="76" y="140" class="s">.schem and .litematic from the schematics folder.</text>
<circle cx="60" cy="172" r="3.5" fill="#a99bff"/><text x="76" y="178" class="s">Ghost blocks show what is left; red, what is wrong.</text>
<circle cx="60" cy="210" r="3.5" fill="#a99bff"/><text x="76" y="216" class="s">Move and turn it with keys or the tab buttons.</text>
<circle cx="60" cy="248" r="3.5" fill="#a99bff"/><text x="76" y="254" class="s">Previews are kept per world across sessions.</text>
<circle cx="60" cy="286" r="3.5" fill="#a99bff"/><text x="76" y="292" class="s">Start builds it; it goes on after a restart.</text>
