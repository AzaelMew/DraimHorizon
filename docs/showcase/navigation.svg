</style>
<rect width="1120" height="420" rx="22" fill="#121b30"/>
<path d="M25 30V390" stroke="#a99bff" stroke-width="3"/>
<text x="52" y="52" class="k">BARITONE · SHARED ROUTING</text>
<text x="52" y="96" class="t">Walks the way a player would.</text>
<circle cx="60" cy="134" r="3.5" fill="#a99bff"/><text x="76" y="140" class="s">Diagonals, slabs, stairs and snow by real shape.</text>
<circle cx="60" cy="172" r="3.5" fill="#a99bff"/><text x="76" y="178" class="s">Opens doors, gates, trapdoors; climbs ladders.</text>
<circle cx="60" cy="210" r="3.5" fill="#a99bff"/><text x="76" y="216" class="s">Drops by health and armour; jumps gaps with a run.</text>
<circle cx="60" cy="248" r="3.5" fill="#a99bff"/><text x="76" y="254" class="s">Glides on elytra; swims; avoids lava.</text>
<circle cx="60" cy="286" r="3.5" fill="#a99bff"/><text x="76" y="292" class="s">Remembers routes; looks where it goes.</text>
