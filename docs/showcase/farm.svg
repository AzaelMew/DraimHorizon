<path d="M25 30V390" stroke="#a99bff" stroke-width="3"/>
<text x="52" y="52" class="k">BARITONE · FARM</text>
<text x="52" y="96" class="t">A farm that runs itself.</text>
<circle cx="60" cy="134" r="3.5" fill="#a99bff"/><text x="76" y="140" class="s">Plots: /farm pos1, /farm pos2, /farm save.</text>
<circle cx="60" cy="172" r="3.5" fill="#a99bff"/><text x="76" y="178" class="s">Fair quarters for up to four crops; no limit.</text>
<circle cx="60" cy="210" r="3.5" fill="#a99bff"/><text x="76" y="216" class="s">Three chests, a composter and a safe idle spot.</text>
<circle cx="60" cy="248" r="3.5" fill="#a99bff"/><text x="76" y="254" class="s">Bone meal; hay bales; re-tills trampled beds.</text>
<circle cx="60" cy="286" r="3.5" fill="#a99bff"/><text x="76" y="292" class="s">Sells with /sell hand; finds its plots after restarts.</text>
