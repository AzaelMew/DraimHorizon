    <text x="22" y="194" class="copy">Live minimap slices · explored terrain</text>
    <text x="22" y="224" class="copy">Three-dimension Seed Map · opt-in 3D borders</text>
  </g>
  <g transform="translate(572 196)">
    <rect width="516" height="248" rx="20" class="card"/>
    <text x="22" y="38" class="title">Chat &amp; translation</text>
