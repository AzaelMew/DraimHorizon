<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1010" viewBox="0 0 1120 1010" role="img" aria-labelledby="title desc">
  <title id="title">DraimHorizons feature overview</title>
  <desc id="desc">Illustrated feature diagrams for maps, chat, friends, trading, inventory and zoom in the DraimHorizons native mod.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#131c33"/><stop offset="1" stop-color="#0c1020"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#b9dbcf" stroke-opacity=".19"/>
    </pattern>
    <style>
      text { font-family: system-ui, 'Segoe UI', sans-serif; fill: #f0f3ff; }
      .brand { font-size: 61px; font-weight: 800; }
      .title { font-size: 27px; font-weight: 750; }
      .copy { font-size: 20px; fill: #c7d1ea; }
      .mono { font-family: 'Consolas', monospace; font-size: 18px; fill: #c8d5f0; }
      .key { font-family: 'Consolas', monospace; font-size: 18px; font-weight: 700; fill: #16172b; }
      .eyebrow { font-size: 16px; font-weight: 750; letter-spacing: 2px; fill: #a3b6e5; }
      .card { fill: #1a233b; stroke: #384563; stroke-width: 1.5; }
      .sample { fill: #10182b; stroke: #34415f; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1120" height="1010" rx="34" fill="url(#background)"/>
  <path d="M0 172H1120" stroke="#364362"/>
  <g transform="translate(42 27)">
    <text class="eyebrow" y="19">NATIVE CLIENT MOD FOR HORIZON</text>
    <text class="brand" y="83">DraimHorizons</text>
    <text class="copy" y="121">Maps, chat and tools for Horizon SMP</text>
  </g>
  <g transform="translate(844 50)">
    <rect width="232" height="73" rx="13" class="sample"/>
    <rect x="15" y="16" width="37" height="40" rx="8" fill="#b9a9ff"/>
    <text x="28" y="42" class="key">J</text>
    <text x="65" y="31" class="eyebrow">MOD MENU</text>
    <text x="65" y="55" class="mono">RU / EN</text>
  </g>
  <g transform="translate(32 196)">
    <rect width="516" height="248" rx="20" class="card"/>
    <text x="22" y="38" class="title">Maps &amp; claim borders</text>
    <rect x="446" y="15" width="47" height="32" rx="7" fill="#9de2bd"/>
    <text x="463" y="37" class="key">M</text>
    <g transform="translate(22 59)">
      <rect width="472" height="99" rx="9" fill="#24403d"/>
      <path d="M0 66 75 31 138 51 190 27 269 43 324 21 472 51V99H0Z" fill="#3e6952"/>
      <path d="M67 0 121 18 161 63 247 87 298 59 374 52 454 93" fill="none" stroke="#598bc1" stroke-width="13"/>
      <rect width="472" height="99" rx="9" fill="url(#grid)"/>
      <path d="M48 25H96V73H48Z" fill="#9de2bd" fill-opacity=".16" stroke="#9de2bd" stroke-width="2"/>
      <path d="M339 61 351 33 363 61 351 56Z" fill="#fff3a9"/>
      <path d="m413 30 8-8 8 8-8 8Z" fill="#f2b2ff"/>
      <rect x="7" y="7" width="63" height="22" rx="5" fill="#10182b"/>
      <text x="14" y="23" class="mono" style="font-size:14px">Y 65</text>
