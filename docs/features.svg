      <rect width="472" height="99" rx="9" class="sample"/>
      <path d="M17 76H179M17 51H179M17 26H179" stroke="#34415f"/>
      <path d="m17 73 25-10 27 4 26-22 26 6 27-17 31-9" fill="none" stroke="#9de2bd" stroke-width="3" stroke-linecap="round"/>
      <text x="206" y="33" class="mono">Watched prices</text>
      <text x="206" y="61" class="mono">Auction favorites</text>
      <text x="206" y="83" class="mono" style="font-size:14px;fill:#9de2bd">PRICE HISTORY</text>
    </g>
    <text x="22" y="194" class="copy">Market and auction views · price tracking</text>
    <text x="22" y="224" class="copy">Balance HUD · profit estimates</text>
  </g>
  <g transform="translate(32 736)">
    <rect width="516" height="248" rx="20" class="card"/>
    <text x="22" y="38" class="title">Inventory &amp; storage</text>
    <g transform="translate(22 59)">
      <rect width="472" height="99" rx="9" class="sample"/>
      <rect x="13" y="12" width="300" height="32" rx="5" fill="#25314e"/>
      <text x="26" y="34" class="mono">Search: iron</text>
      <rect x="327" y="12" width="131" height="32" rx="5" fill="#9de2bd"/>
      <text x="368" y="34" class="key">Sort</text>
      <path d="M13 54h46v33H13zM68 54h46v33H68zM123 54h46v33h-46zM178 54h46v33h-46z" fill="#25314e"/>
      <path d="m22 72 7-9h20l-7 14H22z" fill="#c7d5e5"/>
      <rect x="327" y="54" width="46" height="33" rx="5" fill="#ffcf82" fill-opacity=".18" stroke="#ffd78f" stroke-width="2"/>
      <path d="m335 72 7-9h20l-7 14h-20z" fill="#c7d5e5"/>
