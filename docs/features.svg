      <rect width="472" height="99" rx="9" class="sample"/>
      <path d="M86 29H60v41h26m62-41h26v41h-26m-31-30v20m-10-10h20" fill="none" stroke="#a6c5ff" stroke-width="3" stroke-linecap="round"/>
      <path d="M199 49h44m-11-9 11 9-11 9" fill="none" stroke="#6f83b3" stroke-width="2"/>
      <path d="M307 16h-39v67h39m86-67h39v67h-39m-43-46v24m-12-12h24" fill="none" stroke="#a6c5ff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="22" y="194" class="copy">Hold to zoom · scroll to adjust zoom</text>
    <text x="22" y="224" class="copy">TAB / scoreboard settings · click-through tools</text>
