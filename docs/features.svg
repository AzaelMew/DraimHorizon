    <text x="22" y="224" class="copy">Google translation with optional DeepL backup</text>
  </g>
  <g transform="translate(32 466)">
    <rect width="516" height="248" rx="20" class="card"/>
    <text x="22" y="38" class="title">Friends &amp; waypoints</text>
    <rect x="446" y="15" width="47" height="32" rx="7" fill="#b9a9ff"/>
    <text x="463" y="37" class="key">X</text>
