    <text x="22" y="224" class="copy">Colored waypoints · optional friend relay</text>
  </g>
  <g transform="translate(572 466)">
    <rect width="516" height="248" rx="20" class="card"/>
    <text x="22" y="38" class="title">Trading tools</text>
    <rect x="446" y="15" width="47" height="32" rx="7" fill="#ffd78f"/>
    <text x="463" y="37" class="key">B</text>
