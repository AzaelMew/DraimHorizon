  <g transform="translate(572 736)">
    <rect width="516" height="248" rx="20" class="card"/>
    <text x="22" y="38" class="title">Camera &amp; utilities</text>
    <rect x="446" y="15" width="47" height="32" rx="7" fill="#a6c5ff"/>
    <text x="463" y="37" class="key">Z</text>
