      <rect x="366" y="11" width="94" height="29" rx="6" fill="#2c3859"/>
      <text x="292" y="31" class="mono">/tpa</text><text x="377" y="31" class="mono">/trade</text>
      <path d="M28 58a9 9 0 0 1 9 9c0 7-9 14-9 14s-9-7-9-14a9 9 0 0 1 9-9Z" fill="#9de2bd"/>
      <circle cx="28" cy="67" r="3" fill="#10182b"/>
      <text x="49" y="77" class="mono">Portal base</text>
    </g>
