# The official SMP judges the client brand sent in the configuration phase, before it answers, so
# the very first `minecraft:brand` must already say `horizon` there. The network thread decides it
# from the address the player typed; every other server keeps the client's own `vanilla` bytes.
[[module]]
id = "brand-policy"
file = "crates/horizon-client/src/net.rs"
name = "claim_borders_brand"
source = "brand_policy.rs"

