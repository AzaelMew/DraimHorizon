[mod]
id = "claim_borders"
version = "0.2.0"
priority = 100

# Client chat and world gizmo adapters target exact source, not just stable hooks.
[compatibility]
horizon_revision = "c9d474dd9116e84c243f8992d75c11314df56f06"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "claim_borders"
source = "runtime.rs"

[[injection]]
id = "chat"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::chat_line"
helper = "chat.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "content", ty = "&horizon_client::text::Text", value = "&content" },
  { name = "source", ty = "horizon_client::chat::ChatSource", value = "source" },
]

[[injection]]
id = "render"
kind = "HEAD"
target = "horizon_client::game::debug_renderers::Game<'_>::debug_renderer_gizmos"
helper = "render.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "gizmos", ty = "&mut horizon_client::gizmos::Gizmos", value = "&mut *g" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "commands"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_commands"
helper = "commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<&'static str>", value = "&mut *commands" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "disconnect"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::leave_server"
helper = "reset.rs"

[[injection]]
id = "connect"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::connect_server_with_options"
helper = "reset.rs"

[[module]]
id = "waypoints"
file = "crates/horizon-client/src/game.rs"
name = "claim_borders_waypoints"
source = "waypoints.rs"

[[module]]
id = "party"
file = "crates/horizon-client/src/game.rs"
name = "claim_borders_party"
source = "party.rs"

[[module]]
id = "transport"
file = "crates/horizon-client/src/game.rs"
name = "claim_borders_transport"
source = "transport.rs"

[[module]]
id = "overlay"
file = "crates/horizon-client/src/game.rs"
name = "claim_borders_overlay"
source = "overlay.rs"

[[module]]
id = "overlay-view"
file = "crates/horizon-client/src/game.rs"
name = "claim_borders_overlay_view"
source = "hud.rs"

[[module]]
id = "client"
file = "crates/horizon-client/src/game.rs"
name = "claim_borders_client"
source = "client.rs"

[[injection]]
id = "social-tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "social-hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "hud_hook.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

[[injection]]
id = "private-chat"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::remote::Game<'_>::signed_chat_line"
helper = "private_chat.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "content", ty = "&horizon_client::text::Text", value = "&content" },
]

[[injection]]
id = "typed-relay-consent"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::chat::Game<'_>::handle_chat_input"
helper = "typed_chat.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "message", ty = "&str", value = "message" },
]
