# ScreenView is non-exhaustive in Sunrise
[[rewrite]]
pattern = '''let local = crate::game::(?:native_hooks|claim_borders_platform)::NativeScreenView \{\s*id: screen\.id,\s*menu: screen\.menu,\s*title: screen\.title,\s*rect: \[0\.0, 0\.0, w, h\],\s*slots: screen\.slots,\s*mouse: panel\.local\(screen\.mouse\),\s*partial_tick: screen\.partial_tick,\s*\};'''
replace = '''let mut local = *screen;
    local.rect = [0.0, 0.0, w, h];
    local.mouse = panel.local(screen.mouse);'''

