# Ghost renderer: the module sits in game.rs; the mod crate (ghosts.rs) forwards the two render
# functions' hooks to it through registered function pointers (a lower-crate helper cannot call it).
[[rewrite]]
pattern = 'horizon_client_render::gfx::native_render::claim_borders_ghosts'
replace = 'crate::game::claim_borders_ghosts'
[[rewrite]]
pattern = 'use crate::mesher::Vertex;'
replace = 'use horizon_client::mesher::Vertex;'
files = ["ghost_render.rs"]
[[rewrite]]
pattern = 'pub fn draw\(world: &mut super::WorldDrawn<[^>]*>\) \{'
replace = '''pub fn register() {
    mod_draimhorizon::ghosts::register(draw_erased, wanted);
}

fn draw_erased(world: *mut ()) {
    // SAFETY: the pointer is the live `&mut WorldDrawn` the helper in `world_drawn` got.
    draw(unsafe { &mut *world.cast::<horizon_client_render::render_slots::WorldDrawn<'_>>() });
}

pub fn draw(world: &mut horizon_client_render::render_slots::WorldDrawn<'_>) {'''
files = ["ghost_render.rs"]
[[rewrite]]
pattern = 'pub fn set_anchor\(anchor: \[i32; 3\]\) \{'
replace = 'pub fn set_anchor(anchor: [i32; 3]) {\n    register();'
files = ["ghost_render.rs"]
[[rewrite]]
pattern = 'pub fn put_section\(key: \[i32; 3\], quads: Vec<Vertex>\) \{'
replace = 'pub fn put_section(key: [i32; 3], quads: Vec<Vertex>) {\n    register();'
files = ["ghost_render.rs"]

[injection.ghost-world-drawn]
target = "horizon_mod_render::render::world_drawn"
kind = "HEAD"
helper = "horizon/ghost_drawn_hook.rs"
bindings = [
  { name = "world", ty = "&mut crate::render::WorldDrawn<'_>", value = "&mut *world" },
]

[injection.ghost-render-needs]
target = "horizon_mod_render::render::render_needs"
kind = "HEAD"
helper = "horizon/ghost_needs_hook.rs"
bindings = [
  { name = "needs", ty = "&mut crate::render::RenderNeeds", value = "&mut *needs" },
]

# Not replaceable (private fn in horizon_client_render, no marker) and no caller in the game crate.
[injection.world-map-atlas]
drop = true
reason = "the HUD atlas has no slot for mod images in this Horizon build (HudAtlas::slots is gone) and runtime sprites stop at 256 px; the map images are not drawn until a texture API exists"

# The Horizon login brand is a free function of the network thread in the reusable client library,
# and `brand()` has no host context. Sunrise's engine owns that exchange from a lower crate, so
# neither hook ports; the Sunrise brand coordination is the smp-compat adapter, which `smod` folds into
# this package (platforms/sunrise/smp-compat, mixins under src/mixins/smp/).
[injection.brand-gate]
drop = true
reason = "Sunrise sends the login brand from a lower crate; the smp-compat adapter folded into the .smod coordinates it instead"

[injection.brand-announce]
drop = true
reason = "Sunrise sends the login brand from a lower crate; the smp-compat adapter folded into the .smod coordinates it instead"

# forget_columns (lower crate, not replaceable) runs after take_remote_columns has already taken the
# chunks out of the world, so the hook goes before that call in the game-crate caller instead.
[injection.bar-unload]
target = "horizon_client::game::remote::Game<'_>::forget_remote_columns"
kind = "BEFORE_CALL"
selector = "horizon_client::streaming::Streaming::take_remote_columns"
require = 1
ordinal = 0
helper = "baritone/hooks/unload.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "gone", ty = "&horizon_client::fast_hash::FxHashSet<(i32, i32)>", value = "&*gone" },
]

# Replaceable functions live in horizon_client_lib (files under crates/horizon-client/src that are not game/).
[injection.chat-local]
target = "horizon_client::game::native_hooks::Game<'_>::native_chat"
[injection.bar-lines]
target = "horizon_client_lib::gizmos::camera_relative"

# Horizon's Game::native_* host helpers, spelled the Sunrise way.
[[module]]
id = "horizon-platform"
file = "crates/horizon-client/src/game.rs"
name = "claim_borders_platform"
source = "horizon_platform.rs"


[[rewrite]]
pattern = 'horizon_world::nbt\b'
replace = 'horizon_core::nbt'

# Sunrise's text-width helper takes an unused batch; the shim measures without one.
[[rewrite]]
pattern = '\.native_text_width\('
replace = '.horizon_text_width('

# Sunrise's native_text takes ARGB and draws nothing at alpha 0; the shared helper passes RGB.
[[rewrite]]
pattern = 'game\.native_text\(batch, value, at, ink\(rgb\), false\)'
replace = 'game.native_text(batch, value, at, 0xff00_0000 | ink(rgb), false)'

# Names that moved or lost visibility in Sunrise.
[[rewrite]]
pattern = 'horizon_assets::'
replace = 'horizon_assets::'
[[rewrite]]
pattern = 'gfx::native_render::claim_borders_ghosts'
replace = 'render_slots::claim_borders_ghosts'
# `mobs::data::LAND` is private in Sunrise; its value is the flag 1.
[[rewrite]]
pattern = 'horizon_client::mobs::data::LAND\b'
replace = '1u16'
[[rewrite]]
pattern = '\bremote_text\('
replace = 'crate::game::remote::remote_text('
files = ["claim_actionbar_hook.rs"]

# Engine API differences found by compiling against the pinned Sunrise Nightly.
# crate renamed
[[rewrite]]
pattern = '''\bhorizon_threads\b'''
replace = '''horizon_threads'''

# ClickQueue is a bounded queue now
[[rewrite]]
