# Differences between the Horizon source the mod is written against (the shared bundle) and the current Horizon Nightly.
# Every injection not listed resolves automatically (tools/sunrise.py resolve).

[module_file]
"crates/horizon-client/src/game/extras.rs" = "crates/horizon-client/src/game/interface/extras.rs"
"crates/horizon-client/src/game/scoreboard.rs" = "crates/horizon-client/src/game/interface/scoreboard/mod.rs"
"crates/horizon-client/src/game/remote.rs" = "crates/horizon-client/src/game/network/remote/mod.rs"
"crates/horizon-client/src/game/agent.rs" = "crates/horizon-client/src/game/runtime/agent/mod.rs"

# Horizon's Native* records are Sunrise's mod_api records with the same fields (aliased in the shim).
[[rewrite]]
pattern = 'native_hooks::(Native(?:Zoom|Minimap|ScreenView|Mod))\b'
replace = 'claim_borders_platform::\1'

[injection.navigation-input]
# Not a MovementInput listener: that would set `sprint_suppressed` for everybody. Run at the head
# of the function (before its "no listener" return) with the same logic as Horizon's remote.rs.
target = "horizon_client::game::native_hooks::movement_input::Game<'_>::mod_movement_keys"
kind = "HEAD"
helper = "horizon/navigation_keys_hook.rs"
bindings = [
  { name = "game", ty = "&Game<'_>", value = "&*self" },
  { name = "keys", ty = "&mut horizon_client::sprint::Keys", value = "&mut keys" },
]

[injection.menu-render]
params = { batch = "draw" }
[injection.inventory-search-highlight]
params = { batch = "draw" }
[injection.shulker-peek-draw]
target = "horizon_client::game::native_hooks::base::Game<'_>::native_tooltip_component_draw"
params = { batch = "draw" }

# Modules whose Horizon file lives in a lower Sunrise crate must sit in the game crate
# (E_MIXIN_MODULE_DESTINATION). Per-module overrides: `drop` removes the row (its code moved to
# the mod crate: overlay/crate/*.rs), `file` relocates it into game.rs.
[module_override.visibility-model]
file = "crates/horizon-client/src/game.rs"
[module_override.ghost-render]
file = "crates/horizon-client/src/game.rs"
[module_override.terrain-bridge]
file = "crates/horizon-client/src/game.rs"
[module_override.bar-mod_unload_stash]
file = "crates/horizon-client/src/game.rs"
[module_override.pat-pose]
drop = true
reason = "state and arm selection live in the mod crate (pat.rs); the pose maths is inlined in the pat-arm helper"
[module_override.pat-arms]
drop = true
reason = "moved to the mod crate (pat.rs)"
[module_override.bar-mod_lines_store]
drop = true
reason = "line store moved to the mod crate (lines.rs); the helper runs in horizon_client_lib"
[module_override.bar-mod_suggest_bridge]
drop = true
reason = "completion provider moved to the mod crate (suggest.rs); the helper runs in horizon_client_render"
[module_override.chat-nickname-list]
drop = true
reason = "needs ChatScreen's private fields: the request goes through the mod crate (suggest.rs) and the bar-suggest helper applies it"
[module_override.brand-policy]
drop = true
reason = "only the two Horizon login-brand hooks use it; Sunrise drops both (see injection.brand-gate)"

