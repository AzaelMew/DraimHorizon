# Mouse buttons reach the key hooks as key.mouse.* (Horizon's native_key), only while playing.
[injection.menu-mouse]
target = "horizon_client::game::native_hooks::base::Game<'_>::native_mouse_button_post"
helper = "menu_open_hook.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "if !self.native_playing() { \"key.mouse.none\" } else { match button { 0 => \"key.mouse.left\", 1 => \"key.mouse.right\", 2 => \"key.mouse.middle\", 3 => \"key.mouse.4\", 4 => \"key.mouse.5\", _ => \"key.mouse.none\" } }" },
  { name = "action", ty = "mod_api::KeyAction", value = "if pressed { mod_api::KeyAction::Press } else { mod_api::KeyAction::Release }" },
]
