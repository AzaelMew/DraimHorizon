# Differences between the Horizon source the mod is written against and Sunrise.
# Every injection not listed resolves automatically (tools/sunrise.py resolve).

[module_file]
"crates/horizon-client/src/game/extras.rs" = "crates/sunrise-client/src/game/interface/extras.rs"
"crates/horizon-client/src/game/scoreboard.rs" = "crates/sunrise-client/src/game/interface/scoreboard/mod.rs"
"crates/horizon-client/src/game/remote.rs" = "crates/sunrise-client/src/game/network/remote/mod.rs"
"crates/horizon-client/src/game/agent.rs" = "crates/sunrise-client/src/game/runtime/agent/mod.rs"

# Horizon's Native* records are Sunrise's mod_api records with the same fields (aliased in the shim).
[[rewrite]]
pattern = 'native_hooks::(Native(?:Zoom|Minimap|ScreenView|Mod))\b'
replace = 'claim_borders_platform::\1'

[injection.navigation-input]
# Not a MovementInput listener: that would set `sprint_suppressed` for everybody. The keys the
# local player moves with come back from update_movement_input (after any typed listener), and
# the navigation steers them with the same logic as Horizon's movement input.
target = "sunrise_client::game::native_hooks::movement_input::Game<'_>::update_movement_input"
kind = "RETURN"
helper = "sunrise/navigation_keys_hook.rs"
bindings = [
  { name = "keys", ty = "Keys", value = "$value" },
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
]

[injection.menu-render]
params = { batch = "draw" }
[injection.inventory-search-highlight]
params = { batch = "draw" }
# Horizon's signed_chat_line is three places in Sunrise: add_chat_line (system and client lines),
# a player's line once chat_received has let it through, and the validation error line
# show_queued_chat shows. A captured line is not recorded, and a player's or error line is not
# narrated and counts as not shown, as before. The shared hook body is a module here, so
# each place's helper says whether its line is a validation error.
[[module]]
id = "chat-capture-body"
file = "crates/sunrise-client/src/game.rs"
name = "claim_borders_chat_capture"
source = "chat_capture_hook.rs"
[[rewrite]]
pattern = '''^fn horizon_chat_capture\(\s*trust: &crate::game::remote::ChatTrust,'''
replace = '''pub(crate) fn horizon_chat_capture(
    error: bool,'''
files = ["chat_capture_hook.rs"]
[[rewrite]]
pattern = '''(?s)let allowed = !matches!\(trust, crate::game::remote::ChatTrust::NotSecure\)\s*\|\| !game\.settings\.file\.bool\("onlyShowSecureChat"\);'''
replace = '''// show_queued_chat drops a line onlyShowSecureChat hides before it is recorded.
    let allowed = true;'''
files = ["chat_capture_hook.rs"]
[[rewrite]]
pattern = '''matches!\(trust, crate::game::remote::ChatTrust::Error\)'''
replace = '''error'''
files = ["chat_capture_hook.rs"]
[injection.chat-capture]
target = "sunrise_client::game::remote::chat::Game<'_>::add_chat_line"
kind = "HEAD"
cancellable = true
helper = "sunrise/chat_capture_line_hook.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "content", ty = "&sunrise_client::text::Text", value = "&content" },
  { name = "source", ty = "sunrise_client::chat::ChatSource", value = "source" },
]
# show_queued_chat's body uses serde_json::json!, which a call-site row cannot patch; its player
# lines pass chat_received (system = false) just before they are recorded.
[injection.chat-capture-player]
target = "sunrise_client::game::remote::chat_received::Game<'_>::chat_received"
kind = "RETURN"
helper = "sunrise/chat_capture_player_hook.rs"
bindings = [
  { name = "value", ty = "bool", value = "$value" },
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "system", ty = "bool", value = "system" },
  { name = "line", ty = "&sunrise_client::text::Text", value = "&*line" },
]
# The validation error line: show_queued_chat answers it as not shown, unnarrated and without a
# Chat Delay restart when the capture takes it, as Horizon's signed_chat_line did. HEAD, since the
# body's serde_json::json! refuses call-site rows.
[injection.chat-capture-error]
target = "sunrise_client::game::remote::chat::Game<'_>::show_queued_chat"
kind = "HEAD"
cancellable = true
helper = "sunrise/chat_capture_error_hook.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "chat", ty = "&crate::game::remote::chat_received::QueuedChat", value = "&chat" },
]
# mob_geometry is test-only in Sunrise; other_creature_geometry runs once a frame from entity_geometry.
[injection.visibility-models]
target = "sunrise_client::game::creatures::Game<'_>::other_creature_geometry"
# Sunrise's draw_inventory returns whether the inventory painter ran.
[injection.live-commerce-inventory]
helper = "sunrise/commerce_inventory_hook.rs"
# Sunrise's chat_key_code returns whether it handled the key.
[injection.chat-nickname-completion]
helper = "sunrise/chat_completion_hook.rs"
# Sunrise's end_predictions returns a Result: the helper hands it back unchanged.
[injection.mining-ack]
helper = "sunrise/mining_ack_hook.rs"
bindings = [
  { name = "value", ty = "Result<()>", value = "$value" },
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "sequence", ty = "i32", value = "sequence" },
]

[[rewrite]]
pattern = 'sunrise_client::mobs::render::claim_borders_visibility_model::'
replace = 'crate::game::claim_borders_visibility_model::'

# Modules whose Horizon file lives in a lower Sunrise crate must sit in the game crate
# (E_MIXIN_MODULE_DESTINATION). Per-module overrides: `drop` removes the row (its code moved to
# the mod crate: overlay/crate/*.rs), `file` relocates it into game.rs.
[module_override.visibility-model]
file = "crates/sunrise-client/src/game.rs"
[module_override.ghost-render]
file = "crates/sunrise-client/src/game.rs"
[module_override.terrain-bridge]
drop = true
reason = "the engine's Minimap is gone: the mod's own scanner (claim_borders_minimap_scan) owns its tiles"
[module_override.bar-mod_unload_stash]
file = "crates/sunrise-client/src/game.rs"
[module_override.pat-pose]
drop = true
reason = "state and arm selection live in the mod crate (pat.rs); the pose maths is inlined in the pat-arm helper"
[module_override.pat-arms]
drop = true
reason = "moved to the mod crate (pat.rs)"
[module_override.bar-mod_lines_store]
drop = true
reason = "line store moved to the mod crate (lines.rs); the helper runs in sunrise_client_lib"
[module_override.bar-mod_suggest_bridge]
drop = true
reason = "completion provider moved to the mod crate (suggest.rs); the helper runs in sunrise_client_render"
[module_override.chat-nickname-list]
drop = true
reason = "needs ChatScreen's private fields: the request goes through the mod crate (suggest.rs) and the bar-suggest helper applies it"
[module_override.brand-policy]
drop = true
reason = "only the two Horizon login-brand hooks use it; Sunrise drops both (see injection.brand-gate)"

