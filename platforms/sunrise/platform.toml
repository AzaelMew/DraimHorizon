# Not replaceable (private fn in sunrise_client_render, no marker) and no caller in the game crate.
[injection.world-map-atlas]
drop = true
reason = "HudAtlas::slots is private in a lower crate without #[replaceable]; no replaceable caller can add atlas images"

# The Horizon login brand is a free function of the network thread in the reusable client library,
# and `brand()` has no host context. Sunrise's engine owns that exchange from a lower crate, so
# neither hook ports; Sunrise's engine owns that exchange and, since Nightly `ed3ac19`, sends the
# Horizon identity itself (`sunrise-official`), so the mod carries no brand adapter any more.
[injection.brand-gate]
drop = true
reason = "Sunrise sends the login brand from a lower crate; since Nightly ed3ac19 sunrise-official announces the Horizon identity itself"

[injection.brand-announce]
drop = true
reason = "Sunrise sends the login brand from a lower crate; since Nightly ed3ac19 sunrise-official announces the Horizon identity itself"

# Nightly 520fc48 moved auto-reconnect out of sunrise-client into `sunrise-reconnect`, a platform
# layer registered by the official executable: it decides with the same refusal policy the mod
# carried (never kicks, bans or refusals) and the client crate no longer has a hook to replace.
[injection.reconnect-after-disconnect]
drop = true
reason = "since Nightly 520fc48 auto-reconnect lives in the sunrise-reconnect platform layer, with the same refusal policy; no client-side hook remains"

# `settings.extras.auto_reconnect` went with it: the switch and its Extras row belong to
# sunrise-reconnect now, so the mod's own Auto-reconnect toggle goes. Two switches, one of them
# inert, would disagree, and the mod crate cannot reach the platform store that owns the state.
[[rewrite]]
# The startup default that turned the engine's switch on.
pattern = '''            game\.settings\.extras\.auto_reconnect = true;\n            game\.settings\.save\(&Game::options_path\(\)\);\n            game\.native_set_setting\(claims::SETTINGS_ID, "auto_reconnect_initialized", "true"\);'''
replace = '''            // Sunrise: auto-reconnect is the official layer's switch (sunrise-reconnect).'''
files = ["client.rs"]
[[rewrite]]
pattern = '''            auto_reconnect: game\.settings\.extras\.auto_reconnect,\n'''
replace = ""
files = ["client.rs"]
[[rewrite]]
pattern = '''        Action::ToggleReconnect => \{\n            game\.settings\.extras\.auto_reconnect = !game\.settings\.extras\.auto_reconnect;\n            game\.settings\.save\(&Game::options_path\(\)\);\n            Ok\(Vec::new\(\)\)\n        \}\n'''
replace = ""
files = ["client.rs"]
[[rewrite]]
pattern = '''    pub auto_reconnect: bool,\n'''
replace = ""
files = ["menu.rs"]
[[rewrite]]
pattern = '''\n    ToggleReconnect,\n'''
replace = ""
files = ["menu.rs"]
[[rewrite]]
pattern = '''            Self::ToggleReconnect => f\.write_str\("ToggleReconnect"\),\n'''
replace = ""
files = ["menu.rs"]
[[rewrite]]
pattern = '''            Control::ToggleReconnect => Some\(Action::ToggleReconnect\),\n'''
replace = ""
files = ["menu.rs"]
[[rewrite]]
pattern = '''                blocks\.push\(vec!\[toggle\(\n                    localized!\(\n                        language,\n                        "Авто-реконнект: \{\}",\n                        "Auto reconnect: \{\}",\n                        state\(model\.auto_reconnect\)\n                    \),\n                    Control::ToggleReconnect,\n                    model\.auto_reconnect,\n                    language\.text\(\n                        "Вернуться на сервер после потери соединения",\n                        "Rejoin the server after a lost connection",\n                    \),\n                \)\]\);\n'''
replace = ""
files = ["menu.rs"]

# Nightly 520fc48 turned `DryPlace` from a tuple alias into a struct (`pos`, `changes`, and a
# private `matches_candidate`): the module is injected into `game`, where the struct's fields are
# visible, but its name is not, so the fields are read rather than destructured.
[[rewrite]]
pattern = '''let Some\(\(at, changes\)\) = dry else \{\n            why = "refused";\n            continue;\n        \};\n'''
replace = '''let Some(placed) = dry else {\n            why = "refused";\n            continue;\n        };\n        let at = placed.pos;\n        let changes = placed.changes;\n'''
files = ["construction_view.rs"]

# forget_columns (lower crate, not replaceable) runs after take_remote_columns has already taken the
# chunks out of the world, so the hook goes before that call in the game-crate caller instead
# (since Dev f8aa80e, free_remote_columns).
[injection.bar-unload]
target = "sunrise_client::game::remote::kept_columns::Game<'_>::free_remote_columns"
kind = "BEFORE_CALL"
selector = "sunrise_client::streaming::Streaming::take_remote_columns"
require = 1
ordinal = 0
helper = "baritone/hooks/unload.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "gone", ty = "&sunrise_client::fast_hash::FxHashSet<(i32, i32)>", value = "&*gone" },
]

