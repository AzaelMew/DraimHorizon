[[rewrite]]
pattern = 'screen\.draimhorizons_nickname_list\(&Measure\(&game\.gui\.atlas\.font\), start, names, force\);'
replace = 'let _ = (&Measure(&game.gui.atlas.font), screen, start, names, force);'
files = ["chat_view.rs"]
[[rewrite]]
pattern = 'slice\.scanner\.claim_borders_tiles\(before\)'
replace = 'slice.scanner.tiles_since(before)'

# Ghost renderer: the module sits in game.rs; the mod crate (ghosts.rs) forwards the two render
