# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Review settings for CodeRabbit. Draft PRs are reviewed because every PR starts as a draft.
language: en-US
reviews:
  profile: chill
  poem: false
  path_filters:
    - "!.ai-playbook/**"
  auto_review:
    enabled: true
    drafts: true
  path_instructions:
    - path: "mixins/**"
      instructions: |
        Keep network, disk scans, and expensive generation off the render/game thread, with bounded queues and caches.
        Never execute translated text as a command. Keep SETTINGS_ID (claim_borders) unchanged. Preserve old
        preferences, chat archives, waypoints, and explored terrain.
    - path: "relay/**"
      instructions: |
        Keep credentials out of source, logs, and archives. Requests must be authenticated and bounded.
    - path: "tools/**"
      instructions: |
        Version files must stay consistent across Cargo.toml, Cargo.lock, horizon-mixin.toml, and runtime.rs.
    - path: "**"
      instructions: |
        Do not suggest speculative refactors, new dependencies, or comments that only restate the code.
        Mention missing tests only when behavior changes.
