services:
  relay:
    build: .
    environment:
      RELAY_ACCESS_TOKEN: ${RELAY_ACCESS_TOKEN:-}
      RELAY_TRUSTED_PROXY_CIDRS: 127.0.0.0/8,::1/128,172.29.50.2/32
    networks:
      relay_private:
        ipv4_address: 172.29.50.3
    expose:
      - "8765"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: "none"
  caddy:
    image: caddy:2.10.2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    networks:
      relay_private:
        ipv4_address: 172.29.50.2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: "none"
volumes:
  caddy_data:
  caddy_config:
networks:
  relay_private:
    ipam:
      config:
        - subnet: 172.29.50.0/24
