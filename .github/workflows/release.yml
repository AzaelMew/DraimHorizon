name: Verify and release DraimHorizons
on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'mixins/**'
      - 'src/**'
      - 'relay/**'
      - 'examples/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'compatibility.json'
      - 'rust-toolchain.toml'
      - '.github/workflows/release.yml'
      - '.github/workflows/horizon-compatibility.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish this branch's version as a GitHub pre-release (main publishes a normal release)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: claim-borders-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Format, lint and test runtime
        run: |
          python3 tools/version.py check
          python3 -m unittest discover -s tools/tests -p "test_*.py"
          python3 tools/compatibility.py
          cargo fmt --all --check
          rustfmt --edition 2024 --check mixins/draimhorizon/*.rs
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Verify relay and encrypted client exchange
        timeout-minutes: 5
        run: |
          python3 -m pip install -r relay/requirements.txt
          PYTHONPATH=relay python3 -m unittest discover -s relay/tests -v
          python3 tools/test_relay_e2e.py
          python3 tools/test_relay_container.py
          python3 tools/package_relay.py
      # Native compilation of the modified Horizon client is checked separately by horizon-compatibility.yml.
      - name: Package and validate the Horizon package (.hmod)
        # Horizon builds a native mod from this flat project against the Mod SDK published with its Nightly;
        # the SDK's function index is the offline check of every hook target.
        run: |
          python3 tools/package_flat.py horizon
          DRAIM_TARGET=horizon python3 tools/sunrise.py smod-check --fetch
      - name: Package and validate the Sunrise package (.smod)
        run: |
          python3 tools/package_flat.py sunrise
          python3 tools/sunrise.py smod-check --fetch
      - uses: actions/upload-artifact@v4
        with:
          name: claim-borders-native
          path: |
            target/draimhorizons-*.hmod
            target/draimhorizons-*.hmod.sha256
            target/draimhorizons-*.smod
            target/draimhorizons-*.smod.sha256
            target/draimhorizons-relay-*.tar.gz
            target/draimhorizons-relay-*.tar.gz.sha256
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.prerelease))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: claim-borders-native
          path: release-assets
      - name: Publish version once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ github.ref != 'refs/heads/main' }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          tag="v${version}"
          title="DraimHorizon ${version} - Horizon & Sunrise"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$PRERELEASE" = "true" ]; then
              echo "Pre-release $tag already exists; refreshing its title and notes, keeping its artifacts."
              gh release edit "$tag" --title "$title" --notes-file docs/release-notes.md
            else
              echo "Release $tag already exists; keeping published artifacts unchanged."
            fi
            exit 0
          fi
          # Publish only the exact source that passed native client compilation.
          workflows=(horizon-compatibility.yml)
          if [ "$PRERELEASE" = "false" ] && ! git diff --quiet HEAD^ HEAD -- platforms/sunrise; then
            workflows+=(sunrise-compatibility.yml)
          fi
          for workflow in "${workflows[@]}"; do
            for attempt in $(seq 1 90); do
              native_state="$(gh api -X GET "repos/$GH_REPO/actions/workflows/$workflow/runs" -f head_sha="$GITHUB_SHA" --jq '.workflow_runs | map(select(.head_sha == env.GITHUB_SHA)) | max_by(.run_number) | if . == null then "" else [.status, (.conclusion // "pending")] | join(" ") end')"
              if [ "$native_state" = "completed success" ]; then
                break
              fi
              if [[ "$native_state" == completed* ]]; then
                echo "$workflow rejected $GITHUB_SHA: $native_state"
                exit 1
              fi
              if [ "$attempt" = 90 ]; then
                echo "Timed out waiting for $workflow on $GITHUB_SHA"
                exit 1
              fi
              sleep 20
            done
          done
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "$title" --notes-file docs/release-notes.md "${flags[@]}"
