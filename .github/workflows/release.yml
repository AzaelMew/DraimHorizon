name: Verify and release DraimHorizons
on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'mixins/**'
      - 'src/**'
      - 'relay/**'
      - 'examples/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'compatibility.json'
      - 'rust-toolchain.toml'
      - '.github/workflows/release.yml'
      - '.github/workflows/horizon-compatibility.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Publish this branch's version as a GitHub pre-release (main publishes a normal release)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: claim-borders-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Format, lint and test runtime
        run: |
          python3 tools/version.py check
          python3 -m unittest discover -s tools/tests -p "test_*.py"
          # Temporary: horizon-rust is unavailable; Sunrise releases still require a current pin.
          python3 tools/compatibility.py --sunrise-only --strict-sunrise
          cargo fmt --all --check
          rustfmt --edition 2024 --check mixins/draimhorizon/*.rs
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Verify relay and encrypted client exchange
        timeout-minutes: 5
        run: |
          python3 -m pip install -r relay/requirements.txt
          PYTHONPATH=relay python3 -m unittest discover -s relay/tests -v
          python3 tools/test_relay_e2e.py
          python3 tools/test_relay_container.py
          python3 tools/package_relay.py
      # Native compilation of the modified Horizon client is checked separately by horizon-compatibility.yml.
      - name: Package and validate the Horizon package (.hmod)
        # Temporary: restore Horizon packaging and SDK validation after upstream recovery.
        if: ${{ false }}
        # Horizon builds a native mod from this flat project against the Mod SDK published with its Nightly;
        # the SDK's function index is the offline check of every hook target.
        run: |
          python3 tools/package_flat.py horizon
          DRAIM_TARGET=horizon python3 tools/sunrise.py smod-check --fetch
      - name: Package and validate the Sunrise package (.smod)
        run: |
          python3 tools/package_flat.py sunrise
          python3 tools/sunrise.py smod-check --fetch
      - uses: actions/upload-artifact@v7
        with:
          name: claim-borders-native
          path: |
            target/draimhorizons-*.smod
            target/draimhorizons-*.smod.sha256
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.prerelease))
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/download-artifact@v8
        with:
          name: claim-borders-native
          path: release-assets
      - name: Publish version once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ github.ref != 'refs/heads/main' }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          tag="v${version}"
          title="DraimHorizon ${version} - Sunrise"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$PRERELEASE" = "true" ]; then
              echo "Pre-release $tag already exists; refreshing its title and notes, keeping its artifacts."
              gh release edit "$tag" --title "$title" --notes-file docs/release-notes.md
            else
              echo "Release $tag already exists; keeping published artifacts unchanged."
            fi
            exit 0
          fi
          # During the horizon-rust outage, verify gates this exact commit with the Sunrise
          # pin check and SDK build. Restore the native workflow wait after upstream recovery.
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" release-assets/*.smod release-assets/*.smod.sha256 --target "$GITHUB_SHA" --title "$title" --notes-file docs/release-notes.md "${flags[@]}"
