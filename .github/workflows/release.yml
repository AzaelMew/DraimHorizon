name: Verify and release DraimHorizons
on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'mixins/**'
      - 'src/**'
      - 'relay/**'
      - 'examples/**'
      - 'tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'compatibility.json'
      - 'rust-toolchain.toml'
      - '.github/workflows/release.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: claim-borders-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Format, lint and test runtime
        run: |
          cargo fmt --all --check
          rustfmt --edition 2024 --check mixins/claim_borders/*.rs
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Verify relay and encrypted client exchange
        timeout-minutes: 5
        run: |
          python3 -m pip install -r relay/requirements.txt
          PYTHONPATH=relay python3 -m unittest discover -s relay/tests -v
          python3 tools/test_relay_e2e.py
          python3 tools/test_relay_container.py
          python3 tools/package_relay.py
      - name: Apply official mixins to exact Horizon source
        timeout-minutes: 8
        run: python3 tools/stage.py
      # Native compilation is checked separately by horizon-compatibility.yml.
      #- name: Check real Horizon client
      #  timeout-minutes: 10
      #  run: cargo check --manifest-path target/mixins/modded/Cargo.toml --target-dir target/horizon-check --locked -p horizon-client --bin horizon-client --no-default-features
      - name: Package and validate native mod
        timeout-minutes: 5
        run: |
          python3 tools/package.py
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          cargo run --manifest-path target/mixins/modded/Cargo.toml --target-dir target/horizon-check --locked -p cargo-horizon-mod -- check "target/draimhorizons-${version}.hnmod" --json
      - uses: actions/upload-artifact@v4
        with:
          name: claim-borders-native
          path: |
            target/draimhorizons-*.hnmod
            target/draimhorizons-*.hnmod.sha256
            target/draimhorizons-relay-*.tar.gz
            target/draimhorizons-relay-*.tar.gz.sha256
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: claim-borders-native
          path: release-assets
      - name: Publish version once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping published artifacts unchanged."
            exit 0
          fi
          # Publish only the exact source that passed native client compilation.
          for attempt in $(seq 1 90); do
            native_state="$(gh api -X GET "repos/$GH_REPO/actions/workflows/horizon-compatibility.yml/runs" -f head_sha="$GITHUB_SHA" -f event=push --jq '.workflow_runs[] | select(.head_sha == env.GITHUB_SHA) | [.status, (.conclusion // "pending")] | join(" ")')"
            if [ "$native_state" = "completed success" ]; then
              break
            fi
            if [[ "$native_state" == completed* ]]; then
              echo "Native validation rejected $GITHUB_SHA: $native_state"
              exit 1
            fi
            if [ "$attempt" = 90 ]; then
              echo "Timed out waiting for native validation of $GITHUB_SHA"
              exit 1
            fi
            sleep 20
          done
          gh release create "$tag" release-assets/* --target "$GITHUB_SHA" --title "DraimHorizons ${version} — Horizon f42ef42" --notes-file docs/release-notes.md
