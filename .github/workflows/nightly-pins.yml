name: Check official Nightly pins
# Horizon publishes a Nightly; Sunrise publishes Nightly and Dev builds. This fails when either pin in compatibility.json
# no longer points at the newest published build, so a refresh and a native re-validation are not forgotten.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compare both pins with the published Nightlies
        run: |
          set -o pipefail
          python3 tools/compatibility.py --strict-sunrise 2>&1 | tee pins.log
      - name: Explain a stale pin
        if: failure()
        run: |
          {
            echo "### A Nightly pin is stale"
            echo
            echo '```'
            cat pins.log
            echo '```'
            echo "Refresh with \`python tools/compatibility.py --update --horizon PATH\` (Horizon) or"
            echo "\`python tools/compatibility.py --update-sunrise --sunrise PATH\` (Sunrise), then adapt the hooks and"
            echo "compile the real client (\`DRAIM_TARGET=horizon python tools/sunrise.py stage --check\`, \`python tools/sunrise.py stage --check\`)."
          } >> "$GITHUB_STEP_SUMMARY"
