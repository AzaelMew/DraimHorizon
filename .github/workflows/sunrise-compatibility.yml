name: Validate Sunrise Nightly client
# Releases that change the Sunrise port wait for these checks. Two routes are checked:
#  - smod:  the shipping route. Generate the flat native project, pack the .smod and validate it offline
#           with the SDK's cargo-sunrise-mod plus the SDK function index (what the launcher validates).
#  - stage: the source route. Apply the bundle to the pinned Sunrise source and compile sunrise-client.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sunrise-compatibility.yml'
      - 'platforms/sunrise/**'
      - 'mixins/**'
      - 'tools/sunrise.py'
      - 'tools/package_flat.py'
      - 'tools/tests/**'
      - 'compatibility.json'
  pull_request:
    paths:
      - '.github/workflows/sunrise-compatibility.yml'
      - 'platforms/sunrise/**'
      - 'compatibility.json'
  workflow_dispatch:

defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: sunrise-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Temporary: keep Sunrise validation without contacting the unavailable horizon-rust.
      - name: Sunrise must target the published Nightly or a newer Dev build
        run: python3 tools/compatibility.py --sunrise-only --strict-sunrise
  smod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Tool tests
        run: python3 -m unittest discover -s tools/tests
      - name: Generate the flat Sunrise project and pack the .smod
        run: python3 tools/package_flat.py sunrise
      - name: Validate the .smod offline against the pinned SDK (SHA256SUMS verified)
        run: python3 tools/sunrise.py smod-check --fetch 2>&1 | tee sunrise-smod-check.log
      - name: Preserve diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sunrise-smod-check
          path: |
            compatibility.json
            sunrise-smod-check.log
            target/draimhorizons-*.smod
            target/draimhorizons-*.smod.sha256
  stage:
    # Temporary: source staging fetches horizon-rust/horizon-mixins, also unavailable.
    # Restore after upstream recovery; the Sunrise SDK check above remains enabled.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Rust and the headers the Sunrise client links against
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
      - name: Show the pins
        run: python3 tools/compatibility.py
      - name: Fetch the pinned Sunrise Nightly
        run: |
          revision="$(python3 -c 'import json; print(json.load(open("compatibility.json"))["sunrise"]["revision"])')"
          git init .local/sunrise
          git -C .local/sunrise remote add origin https://github.com/sunrise-org/sunrise
          git -C .local/sunrise fetch --depth 1 origin "$revision"
          git -C .local/sunrise checkout --detach "$revision"
      - name: Stage the bundle and compile the modified Sunrise client
        run: python3 tools/sunrise.py stage --sunrise .local/sunrise --check --jobs 3 2>&1 | tee sunrise-stage.log
      - name: Preserve diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sunrise-nightly-check
          path: |
            compatibility.json
            sunrise-stage.log
            target/sunrise/plan.json
