name: Horizon f42ef42 compatibility
on:
  push:
    branches: ['feature/horizon-f42ef42']
    paths:
      - '.github/workflows/horizon-compatibility.yml'
      - 'mixins/**'
      - 'tools/**'
      - 'compatibility.json'
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: horizon-f42ef42
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/mixins-cli
            target/horizon-check
          key: horizon-f42ef42-${{ runner.os }}-${{ github.run_id }}
          restore-keys: horizon-f42ef42-${{ runner.os }}-
      - name: Check requested source pin
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          compat=json.loads(Path("compatibility.json").read_text())
          assert compat["horizon_revision"]=="f42ef42ef6ceccb3c6a20bea2481d87949a51c81"
          assert compat["horizon_revision"] in Path("mixins/claim_borders/horizon-mixin.toml").read_text()
          print("COMPATIBILITY_JSON "+json.dumps(compat,separators=(",",":")))
          PY
      - name: Test mod runtime
        run: |
          cargo fmt --all --check
          rustfmt --edition 2024 --check mixins/claim_borders/*.rs
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Stage official mixins
        id: official
        continue-on-error: true
        run: python3 tools/stage.py 2>&1 | tee compatibility-stage.log
      - name: Diagnose with the isolated builtin-attribute fix
        if: steps.official.outcome == 'failure'
        run: |
          git -C .local/horizon-mixins apply "$GITHUB_WORKSPACE/tools/horizon-mixins-recursion-limit.patch"
          cargo build --locked --manifest-path .local/horizon-mixins/Cargo.toml -p horizon-mixins-cli --target-dir target/mixins-cli
          cli="$GITHUB_WORKSPACE/target/mixins-cli/debug/horizon-mixins"
          original="$GITHUB_WORKSPACE/target/mixins/original/f42ef42ef6ceccb3c6a20bea2481d87949a51c81"
          "$cli" plan --workspace "$original" --mods "$GITHUB_WORKSPACE/mixins" --out target/mixins/diagnostic-plan.json 2>&1 | tee compatibility-patched-plan.log
          "$cli" apply --workspace "$original" --mods "$GITHUB_WORKSPACE/mixins" --out "$GITHUB_WORKSPACE/target/mixins/modded" 2>&1 | tee compatibility-patched-stage.log
      - name: Compile real Horizon client
        run: cargo check --manifest-path target/mixins/modded/Cargo.toml --target-dir target/horizon-check --locked -p horizon-client --bin horizon-client --no-default-features 2>&1 | tee compatibility-client.log
      - name: Validate package
        if: steps.official.outcome == 'success'
        run: |
          python3 tools/package.py
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')"
          cargo run --manifest-path target/mixins/modded/Cargo.toml --target-dir target/horizon-check --locked -p cargo-horizon-mod -- check "target/draimhorizons-${version}.hnmod" --json
      - name: Require unpatched official-tool compatibility
        if: success() && steps.official.outcome != 'success'
        run: |
          echo "Diagnostic compilation used a tool patch. Do not release until the official indexer accepts the compiler builtin recursion_limit attribute."
          exit 1
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/mixins-cli
            target/horizon-check
          key: horizon-f42ef42-${{ runner.os }}-${{ github.run_id }}
      - name: Preserve diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-f42ef42-check
          path: |
            compatibility.json
            compatibility-*.log
            target/mixins/plan-output.json
            target/draimhorizons-*.hnmod
            target/draimhorizons-*.hnmod.sha256
