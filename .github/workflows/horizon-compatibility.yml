name: Inventory tools native validation
on:
  push:
    branches: ['feature/inventory-tools']
    paths:
      - '.github/workflows/horizon-compatibility.yml'
      - 'mixins/**'
      - 'tools/**'
      - 'compatibility.json'
defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: inventory-tools-native
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/mixins-cli
            target/horizon-check
          key: horizon-f42ef42-${{ runner.os }}-${{ github.run_id }}
          restore-keys: horizon-f42ef42-${{ runner.os }}-
      - name: Check requested source pin
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          compat=json.loads(Path("compatibility.json").read_text())
          assert compat["horizon_revision"]=="f42ef42ef6ceccb3c6a20bea2481d87949a51c81"
          assert compat["horizon_revision"] in Path("mixins/claim_borders/horizon-mixin.toml").read_text()
          print("COMPATIBILITY_JSON "+json.dumps(compat,separators=(",",":")))
          PY
      - name: Test mod runtime
        run: |
          cargo fmt --all --check
          rustfmt --edition 2024 --check mixins/claim_borders/*.rs
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Stage official mixins
        run: python3 tools/stage.py 2>&1 | tee compatibility-stage.log
      - name: Test the pinned indexer correction
        run: |
          cargo test --manifest-path .local/horizon-mixins/Cargo.toml --target-dir target/mixins-cli --locked -p horizon-mixins-core
          cargo test --manifest-path .local/horizon-mixins/Cargo.toml --target-dir target/mixins-cli --locked -p horizon-mixins-cli --test integration crate_level_built_in_attributes_do_not_make_the_root_a_macro_module
          cargo test --manifest-path .local/horizon-mixins/Cargo.toml --target-dir target/mixins-cli --locked -p horizon-mixins-cli --test integration known_tool_attributes_pass_and_other_two_segment_attributes_still_fail
      - name: Compile real Horizon client
        run: cargo check --manifest-path target/mixins/modded/Cargo.toml --target-dir target/horizon-check --locked -p horizon-client --bin horizon-client --no-default-features 2>&1 | tee compatibility-client.log
      - name: Validate package
        run: |
          python3 tools/package.py
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')"
          cargo run --manifest-path target/mixins/modded/Cargo.toml --target-dir target/horizon-check --locked -p cargo-horizon-mod -- check "target/draimhorizons-${version}.hnmod" --json
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/mixins-cli
            target/horizon-check
          key: horizon-f42ef42-${{ runner.os }}-${{ github.run_id }}
      - name: Preserve diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-f42ef42-check
          path: |
            compatibility.json
            compatibility-*.log
            target/mixins/plan-output.json
            target/draimhorizons-*.hnmod
            target/draimhorizons-*.hnmod.sha256
