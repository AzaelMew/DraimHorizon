name: Horizon f42ef42 compatibility
on:
  push:
    branches: ['feature/horizon-f42ef42']
    paths:
      - '.github/workflows/horizon-compatibility.yml'
      - 'mixins/**'
      - 'tools/**'
      - 'compatibility.json'
permissions:
  contents: read
concurrency:
  group: horizon-f42ef42
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Restore build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/mixins-cli
            target/horizon-check
          key: horizon-f42ef42-${{ runner.os }}-${{ github.run_id }}
          restore-keys: horizon-f42ef42-${{ runner.os }}-
      - name: Prepare exact source and compatibility hashes
        run: |
          git init .local/horizon
          git -C .local/horizon remote add origin https://github.com/horizon-rust/horizon.git
          git -C .local/horizon fetch --depth 1 origin f42ef42ef6ceccb3c6a20bea2481d87949a51c81
          git -C .local/horizon checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          revision="f42ef42ef6ceccb3c6a20bea2481d87949a51c81"
          path=Path("compatibility.json")
          compat=json.loads(path.read_text())
          compat["horizon_revision"]=revision
          for name in compat["source_sha256"]:
              compat["source_sha256"][name]=hashlib.sha256((Path(".local/horizon")/name).read_bytes()).hexdigest()
          path.write_text(json.dumps(compat,indent=2)+"\n")
          manifest=Path("mixins/claim_borders/horizon-mixin.toml")
          manifest.write_text(re.sub(r'horizon_revision = "[0-9a-f]+"',f'horizon_revision = "{revision}"',manifest.read_text()))
          print("COMPATIBILITY_JSON "+json.dumps(compat,separators=(",",":")))
          hooks=Path(".local/horizon/crates/horizon-client/src/game/native_hooks.rs").read_text()
          print("HOOKS_API "+str(re.findall(r"NATIVE_HOOKS_API[^=]*=\\s*(\\d+)",hooks)[:1]))
          PY
      - name: Test mod runtime
        run: |
          cargo fmt --all --check
          rustfmt --edition 2024 --check mixins/claim_borders/*.rs
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Stage official mixins
        run: python3 tools/stage.py 2>&1 | tee compatibility-stage.log
      - name: Compile real Horizon client
        run: cargo check --manifest-path target/mixins/modded/Cargo.toml --target-dir target/horizon-check --locked -p horizon-client --bin horizon-client --no-default-features 2>&1 | tee compatibility-client.log
      - name: Validate package
        run: |
          python3 tools/package.py
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')"
          cargo run --manifest-path target/mixins/modded/Cargo.toml --target-dir target/horizon-check --locked -p cargo-horizon-mod -- check "target/draimhorizons-${version}.hnmod" --json
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/mixins-cli
            target/horizon-check
          key: horizon-f42ef42-${{ runner.os }}-${{ github.run_id }}
      - name: Preserve diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-f42ef42-check
          path: |
            compatibility.json
            compatibility-*.log
            target/mixins/plan-output.json
            target/draimhorizons-*.hnmod
            target/draimhorizons-*.hnmod.sha256
