name: Validate official Horizon Nightly client
# Horizon builds native mods from a flat project against its prebuilt game (the Mod SDK it publishes with
# each Nightly), so two routes are checked:
#  - hmod:  the shipping route. Generate the flat native project, pack the .hmod and validate it offline
#           against the SDK's function index (what the launcher validates).
#  - stage: the source route. Apply the bundle to the pinned Horizon source and compile horizon-client.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horizon-compatibility.yml'
      - 'platforms/horizon/**'
      - 'mixins/**'
      - 'src/**'
      - 'relay/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/release.yml'
      - 'tools/**'
      - 'compatibility.json'
  workflow_dispatch:

defaults:
  run:
    shell: bash
permissions:
  contents: read
concurrency:
  group: main-native
  cancel-in-progress: true
jobs:
  native:
    # Temporary: horizon-rust repositories are unavailable. Restore after upstream recovery.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check requested source pin
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          compat=json.loads(Path("compatibility.json").read_text())
          assert len(compat["horizon_revision"]) == 40
          assert compat["horizon_channel"] == "nightly"
          assert compat["horizon_mixins_revision"]=="e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
          assert compat["horizon_revision"] in Path("mixins/draimhorizon/horizon-mixin.toml").read_text()
          print("COMPATIBILITY_JSON "+json.dumps(compat,separators=(",",":")))
          PY
      - name: Check latest official Horizon Nightly (and report Sunrise)
        run: python3 tools/compatibility.py
      - name: Test mod runtime
        run: |
          cargo fmt --all --check
          rustfmt --edition 2024 --check mixins/draimhorizon/*.rs
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Smoke test public translation provider
        continue-on-error: true
        run: cargo test --locked -p claim-borders-relay-client public_provider_translates_fixed_greeting -- --ignored --nocapture
      - name: Tool tests
        run: python3 -m unittest discover -s tools/tests
      - name: Generate the flat Horizon project and pack the .hmod
        run: python3 tools/package_flat.py horizon
      - name: Validate the .hmod offline against the pinned SDK (SHA256SUMS verified)
        run: DRAIM_TARGET=horizon python3 tools/sunrise.py smod-check --fetch 2>&1 | tee horizon-hmod-check.log
      - name: Install the headers the Horizon client links against
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
      # The cache key carries the pins: build scripts record the paths of the exported source, so a cache
      # from another Nightly must never be restored (it failed with `discovering ingredient tests`).
      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/horizon/check-original
            target/horizon/check-modded
            target/horizon/mixins-cli
          key: horizon-nightly-${{ runner.os }}-${{ hashFiles('compatibility.json') }}-${{ github.run_id }}
          restore-keys: horizon-nightly-${{ runner.os }}-${{ hashFiles('compatibility.json') }}-
      - name: Fetch the pinned Horizon Nightly
        run: |
          revision="$(python3 -c 'import json; print(json.load(open("compatibility.json"))["horizon_revision"])')"
          git init .local/horizon
          git -C .local/horizon remote add origin https://github.com/horizon-rust/horizon
          git -C .local/horizon fetch --depth 1 origin "$revision"
          git -C .local/horizon checkout --detach "$revision"
      - name: Stage the bundle and compile the modified Horizon client
        run: DRAIM_TARGET=horizon python3 tools/sunrise.py stage --sunrise .local/horizon --check --jobs 3 2>&1 | tee compatibility-client.log
      - name: Save build cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/horizon/check-original
            target/horizon/check-modded
            target/horizon/mixins-cli
          key: horizon-nightly-${{ runner.os }}-${{ hashFiles('compatibility.json') }}-${{ github.run_id }}
      - name: Preserve diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: horizon-nightly-current-check
          path: |
            compatibility.json
            horizon-hmod-check.log
            compatibility-*.log
            target/horizon/plan.json
            target/draimhorizons-*.hmod
            target/draimhorizons-*.hmod.sha256
